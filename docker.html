<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Docker + CI/CD Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f2f3f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      padding: 35px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
    }

    .status {
      display: inline-block;
      background: #e6f9f0;
      color: #1a9c6a;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      width: 40px;
      margin: 15px auto;
    }

    .footer {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="status">Build Passing</span>
    <h1>This is my first project with CI/CD and Docker</h1>
    <p>Built, containerized, and deployed automatically.</p>
    <hr>
    <p class="footer">Built by Ram Jethani</p>
  </div>

</body>
</html>
